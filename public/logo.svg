<svg viewBox="0 0 140 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ifBlueGrad" x1="0" y1="120" x2="70" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A52E2" />
      <stop offset="50%" stop-color="#0072FF" />
      <stop offset="100%" stop-color="#00C3FF" />
    </linearGradient>

    <linearGradient id="ifBlueTipGrad" x1="40" y1="40" x2="75" y2="5" gradientUnits="userSpaceOnUse">
